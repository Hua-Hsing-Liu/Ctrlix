  <text x="306" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">OPTICAL PHYSICS</text>
  <path d="M350 470 H440" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M438 463 L450 470 L438 477 Z" fill="#FF4F00"/>
  <circle cx="494" cy="470" r="23" fill="#0111A2"/>
  <text x="494" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
  <text x="494" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">AI 影像分析</text>
  <text x="494" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">AI ANALYSIS</text>
  <path d="M538 470 H628" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M626 463 L638 470 L626 477 Z" fill="#FF4F00"/>
  <circle cx="682" cy="470" r="23" fill="#FF4F00"/>
  <text x="682" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>
  <text x="682" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">精準量測</text>
  <text x="682" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">PRECISE MEASURE</text>
