<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="ui-sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#111214" flood-opacity=".08"/></filter>
    <linearGradient id="opt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/><stop offset="1" stop-color="#F5F6F8"/>
    </linearGradient>
    <linearGradient id="opt-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0111A2"/><stop offset=".45" stop-color="#3FA7F5"/>
      <stop offset=".7" stop-color="#FFC531"/><stop offset="1" stop-color="#FF4F00"/>
    </linearGradient>
    <radialGradient id="opt-hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4F00"/><stop offset=".45" stop-color="#FFB12B"/>
      <stop offset=".8" stop-color="#3FA7F5"/><stop offset="1" stop-color="#0111A2"/>
    </radialGradient>
    <filter id="opt-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="opt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#opt-bg)"/>

  <!-- 被測物（工件） -->
  <path d="M120 300 L250 240 L380 300 L250 360 Z" fill="#E1E4EA"/>
  <path d="M190 290 L250 262 L310 290 L250 318 Z" fill="#C9D2EE"/>
  <path d="M190 290 V304 L250 332 L310 304 V290 L250 318 Z" fill="#9FB4F2"/>
  <!-- 光源與光線 -->
  <g stroke="#FFC531" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M150 90 L232 270"/><path d="M180 90 L250 262"/><path d="M210 90 L266 270"/>
  </g>
  <rect x="120" y="66" width="120" height="30" rx="8" fill="#1A1C22"/>
  <rect x="132" y="94" width="96" height="6" rx="3" fill="#FFC531"/>
  <text x="180" y="54" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="700" fill="#58595B">光源</text>
  <!-- 反射光到感測器 -->
  <g stroke="#FF4F00" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8">
    <path d="M262 270 L420 150"/><path d="M276 276 L428 168"/>
  </g>
  <!-- 光學感測模組 -->
  <rect x="410" y="110" width="120" height="86" rx="14" fill="#1A1C22"/>
  <circle cx="448" cy="153" r="26" fill="#2E3139" stroke="#5A5F6B" stroke-width="4"/>
  <circle cx="448" cy="153" r="14" fill="#0111A2"/>
  <circle cx="443" cy="147" r="4" fill="#FFFFFF" opacity=".8"/>
  <rect x="488" y="128" width="28" height="14" rx="3" fill="#FF4F00"/>
  <text x="470" y="226" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#0111A2">光學感測器</text>
  <!-- 物理修正卡：扭曲網格 → 校正網格 -->
  <rect x="580.5" y="220.5" width="199" height="149" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="596" y="244" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700" fill="#000000">光學物理修正</text>
  <path d="M606 250 Q620 290 606 330" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M626 250 Q640 290 626 330" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M646 250 Q660 290 646 330" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M666 250 Q680 290 666 330" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M686 250 Q700 290 686 330" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M600 256 Q646 232 692 256" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M600 274 Q646 256 692 274" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M600 292 Q646 280 692 292" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M600 310 Q646 304 692 310" fill="none" stroke="#B4BAC4" stroke-width="2"/><path d="M600 328 Q646 328 692 328" fill="none" stroke="#B4BAC4" stroke-width="2"/>
  <path d="M694 292 H702" stroke="#FF4F00" stroke-width="3"/>
  <path d="M706 252 V328" stroke="#0111A2" stroke-width="2"/><path d="M722 252 V328" stroke="#0111A2" stroke-width="2"/><path d="M738 252 V328" stroke="#0111A2" stroke-width="2"/><path d="M754 252 V328" stroke="#0111A2" stroke-width="2"/><path d="M770 252 V328" stroke="#0111A2" stroke-width="2"/><path d="M700 256 H770" stroke="#0111A2" stroke-width="2"/><path d="M700 274 H770" stroke="#0111A2" stroke-width="2"/><path d="M700 292 H770" stroke="#0111A2" stroke-width="2"/><path d="M700 310 H770" stroke="#0111A2" stroke-width="2"/><path d="M700 328 H770" stroke="#0111A2" stroke-width="2"/>
  <!-- AI 分析卡 -->
  <rect x="580.5" y="40.5" width="199" height="149" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="596" y="68" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#000000">AI 影像分析</text>
  <rect x="596" y="82" width="168" height="90" rx="8" fill="#F5F6F8"/>
  <path d="M630 150 L680 104 L730 150 Z" fill="#C9D2EE"/>
  <rect x="616" y="94" width="128" height="68" rx="4" fill="none" stroke="#FF4F00" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="616" y="80" width="62" height="18" rx="4" fill="#FF4F00"/>
  <text x="647" y="93" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">辨識完成</text>
  <path d="M534 150 C556 150 564 130 576 120" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>

  <rect x="24.5" y="420.5" width="751" height="159" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  <circle cx="118" cy="470" r="23" fill="#0111A2"/>
  <text x="118" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
  <text x="118" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">光學感測</text>
  <text x="118" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">OPTICAL SENSING</text>
  <path d="M162 470 H252" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M250 463 L262 470 L250 477 Z" fill="#FF4F00"/>
  <circle cx="306" cy="470" r="23" fill="#0111A2"/>
  <text x="306" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
