<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="ui-sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#111214" flood-opacity=".08"/></filter>
    <linearGradient id="cur-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/><stop offset="1" stop-color="#F5F6F8"/>
    </linearGradient>
    <linearGradient id="cur-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0111A2"/><stop offset=".45" stop-color="#3FA7F5"/>
      <stop offset=".7" stop-color="#FFC531"/><stop offset="1" stop-color="#FF4F00"/>
    </linearGradient>
    <radialGradient id="cur-hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4F00"/><stop offset=".45" stop-color="#FFB12B"/>
      <stop offset=".8" stop-color="#3FA7F5"/><stop offset="1" stop-color="#0111A2"/>
    </radialGradient>
    <filter id="cur-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="cur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#cur-bg)"/>

  <defs>
    <linearGradient id="cur-cu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3139"/><stop offset=".5" stop-color="#5A5F6B"/><stop offset="1" stop-color="#1A1C22"/>
    </linearGradient>
  </defs>
  <!-- 電源線 -->
  <path d="M30 270 C 140 270, 160 250, 250 250 H520" fill="none" stroke="url(#cur-cu)" stroke-width="22" stroke-linecap="round"/>
  <path d="M30 270 C 140 270, 160 250, 250 250 H520" fill="none" stroke="#7D8490" stroke-width="3" stroke-dasharray="2 10"/>
  <!-- 夾式電流感測器（CT 環） -->
  <ellipse cx="300" cy="250" rx="34" ry="52" fill="none" stroke="#0111A2" stroke-width="18"/>
  <ellipse cx="300" cy="250" rx="34" ry="52" fill="none" stroke="#3E57D8" stroke-width="5" stroke-dasharray="10 8"/>
  <rect x="286" y="188" width="28" height="18" rx="4" fill="#1A1C22"/>
  <!-- 磁力線 -->
  <g fill="none" stroke="#FF4F00" stroke-width="2.5" opacity=".8">
    <ellipse cx="300" cy="250" rx="58" ry="80"/><ellipse cx="300" cy="250" rx="76" ry="100" stroke-dasharray="6 6"/>
  </g>
  <!-- 電表讀值 -->
  <rect x="110" y="70" width="150" height="110" rx="14" fill="#1A1C22"/>
  <rect x="124" y="84" width="122" height="54" rx="6" fill="#0B1020"/>
  <text x="185" y="110" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#FF4F00">220.4 V</text>
  <text x="185" y="130" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#7FA6F0">3.2 A</text>
  <circle cx="150" cy="160" r="9" fill="#5A5F6B"/><circle cx="185" cy="160" r="9" fill="#5A5F6B"/><circle cx="220" cy="160" r="9" fill="#FF4F00"/>
  <path d="M286 197 C 270 150, 270 140, 262 130" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="330" y="330" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#0111A2">電流感測</text>
  <!-- AI 異常偵測卡 -->
  <rect x="560.5" y="40.5" width="209" height="159" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="578" y="70" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#000000">AI 異常偵測</text>
  <path d="M578 120 H752" stroke="#E4E5E8" stroke-width="2"/>
  <path d="M582 120 Q590 96 602 120 Q614 144 626 120 Q638 96 650 120 Q662 144 674 120 Q686 96 698 120 Q710 144 722 120 Q734 96 746 120" fill="none" stroke="#0111A2" stroke-width="3.5"/>
  <rect x="690" y="88" width="44" height="64" rx="6" fill="none" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="5 4"/>
  <rect x="578" y="166" width="70" height="22" rx="11" fill="#FF4F00"/>
  <text x="613" y="181" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">負載異常</text>
  <path d="M556 150 C 470 160, 400 200, 336 210" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- 電路物理模型卡 -->
  <rect x="560.5" y="230.5" width="209" height="139" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="578" y="260" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="700" fill="#000000">電路物理模型</text>
  <path d="M584 316 H606 l6 -12 l10 24 l10 -24 l10 24 l10 -24 l6 12 H690" fill="none" stroke="#0111A2" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M690 300 V332 M700 306 V326" stroke="#0111A2" stroke-width="3.5"/>
  <path d="M700 316 H752" stroke="#0111A2" stroke-width="3.5"/>
  <text x="668" y="356" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700" fill="#58595B">V = I × R</text>

  <rect x="24.5" y="420.5" width="751" height="159" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  <circle cx="118" cy="470" r="23" fill="#0111A2"/>
  <text x="118" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
  <text x="118" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">電流電壓感測</text>
  <text x="118" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">CURRENT &amp; VOLTAGE</text>
  <path d="M162 470 H252" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M250 463 L262 470 L250 477 Z" fill="#FF4F00"/>
  <circle cx="306" cy="470" r="23" fill="#0111A2"/>
  <text x="306" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
  <text x="306" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">電路物理模型</text>
  <text x="306" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">CIRCUIT MODEL</text>
  <path d="M350 470 H440" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M438 463 L450 470 L438 477 Z" fill="#FF4F00"/>
  <circle cx="494" cy="470" r="23" fill="#0111A2"/>
  <text x="494" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
  <text x="494" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">AI 異常偵測</text>
  <text x="494" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">AI DETECTION</text>
  <path d="M538 470 H628" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M626 463 L638 470 L626 477 Z" fill="#FF4F00"/>
  <circle cx="682" cy="470" r="23" fill="#FF4F00"/>
  <text x="682" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>
  <text x="682" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">自應調控</text>
  <text x="682" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">ADAPTIVE CONTROL</text>
</svg>
