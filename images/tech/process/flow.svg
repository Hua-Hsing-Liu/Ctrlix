  <rect x="396" y="196" width="44" height="40" rx="6" fill="#0111A2"/>
  <path d="M396 252 L440 324 M440 252 L396 324" stroke="#1A1C22" stroke-width="5"/>
  <rect x="408" y="236" width="20" height="16" fill="#5A5F6B"/>
