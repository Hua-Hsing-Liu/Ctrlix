  <rect x="560.5" y="40.5" width="209" height="159" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="578" y="70" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#000000">AI 流量預測</text>
  <path d="M578 186 H752" stroke="#D5D8DE" stroke-width="2"/>
  <path d="M578 120 H752" stroke="#FF4F00" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M580 170 C 610 168, 620 130, 648 124 S 700 116, 750 120" fill="none" stroke="#0111A2" stroke-width="4" stroke-linecap="round"/>
  <text x="752" y="112" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="500" fill="#FF4F00">目標流量</text>
  <path d="M556 150 C 480 150, 450 170, 440 196" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- 流體力學模型卡 -->
  <rect x="560.5" y="230.5" width="209" height="139" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  
  <text x="578" y="260" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" font-weight="700" fill="#000000">流體力學模型</text>
  <path d="M590 280 V350" stroke="#58595B" stroke-width="2"/>
  <path d="M590 286 h30" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/><path d="M590 298 h64" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/><path d="M590 310 h86" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/><path d="M590 322 h94" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/><path d="M590 334 h86" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/><path d="M590 346 h64" stroke="#0111A2" stroke-width="3" stroke-linecap="round"/>
  <path d="M590 286 Q 690 316 590 346" fill="none" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="5 4"/>

  <rect x="24.5" y="420.5" width="751" height="159" rx="18" fill="#FFFFFF" stroke="#EEEFF2" filter="url(#ui-sh)"/>
  <circle cx="118" cy="470" r="23" fill="#0111A2"/>
  <text x="118" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
  <text x="118" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">流量感測</text>
  <text x="118" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">FLOW SENSING</text>
  <path d="M162 470 H252" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M250 463 L262 470 L250 477 Z" fill="#FF4F00"/>
  <circle cx="306" cy="470" r="23" fill="#0111A2"/>
  <text x="306" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
  <text x="306" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">流體力學模型</text>
  <text x="306" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">FLUID MODEL</text>
  <path d="M350 470 H440" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M438 463 L450 470 L438 477 Z" fill="#FF4F00"/>
  <circle cx="494" cy="470" r="23" fill="#0111A2"/>
  <text x="494" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
  <text x="494" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">AI 流量預測</text>
  <text x="494" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">AI PREDICTION</text>
  <path d="M538 470 H628" stroke="#FF4F00" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><path d="M626 463 L638 470 L626 477 Z" fill="#FF4F00"/>
  <circle cx="682" cy="470" r="23" fill="#FF4F00"/>
  <text x="682" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>
  <text x="682" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">閥門自動調控</text>
  <text x="682" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="2" fill="#6B6E75">VALVE CONTROL</text>
</svg>
