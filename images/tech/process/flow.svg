<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="ui-sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#111214" flood-opacity=".08"/></filter>
    <linearGradient id="flw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/><stop offset="1" stop-color="#F5F6F8"/>
    </linearGradient>
    <linearGradient id="flw-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0111A2"/><stop offset=".45" stop-color="#3FA7F5"/>
      <stop offset=".7" stop-color="#FFC531"/><stop offset="1" stop-color="#FF4F00"/>
    </linearGradient>
    <radialGradient id="flw-hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4F00"/><stop offset=".45" stop-color="#FFB12B"/>
      <stop offset=".8" stop-color="#3FA7F5"/><stop offset="1" stop-color="#0111A2"/>
    </radialGradient>
    <filter id="flw-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="flw-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#flw-bg)"/>

  <defs>
    <linearGradient id="flw-pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CDD5"/><stop offset=".45" stop-color="#EEF0F3"/><stop offset="1" stop-color="#9EA4AF"/>
    </linearGradient>
  </defs>
  <!-- 透明管段：流速剖面 -->
  <rect x="40" y="252" width="140" height="72" fill="#DCE6FF" stroke="#9EA4AF" stroke-width="3"/>
  <path d="M60 268 h40" stroke="#0111A2" stroke-width="4" stroke-linecap="round"/><path d="M98 262 l10 6 l-10 6 z" fill="#0111A2"/><path d="M56 288 h56" stroke="#0111A2" stroke-width="4" stroke-linecap="round"/><path d="M110 282 l10 6 l-10 6 z" fill="#0111A2"/><path d="M60 308 h40" stroke="#0111A2" stroke-width="4" stroke-linecap="round"/><path d="M98 302 l10 6 l-10 6 z" fill="#0111A2"/>
  <!-- 金屬管線 -->
  <rect x="180" y="252" width="350" height="72" fill="url(#flw-pipe)"/>
  <rect x="172" y="244" width="18" height="88" rx="3" fill="#8E95A1"/>
  <rect x="470" y="244" width="18" height="88" rx="3" fill="#8E95A1"/>
  <!-- 流量計 -->
  <rect x="240" y="226" width="120" height="124" rx="12" fill="#FFFFFF" stroke="#1A1C22" stroke-width="4"/>
  <circle cx="300" cy="288" r="34" fill="#EEF0F3" stroke="#1A1C22" stroke-width="3"/>
  <g stroke="#0111A2" stroke-width="6" stroke-linecap="round"><path d="M300 262 V314 M274 288 H326 M282 270 L318 306 M318 270 L282 306"/></g>
  <circle cx="300" cy="288" r="7" fill="#FF4F00"/>
  <rect x="246" y="120" width="108" height="72" rx="12" fill="#1A1C22"/>
  <rect x="258" y="132" width="84" height="34" rx="6" fill="#0B1020"/>
  <text x="300" y="155" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#FF4F00">12.6 L/min</text>
  <rect x="290" y="192" width="20" height="34" fill="#8E95A1"/>
  <text x="300" y="108" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#0111A2">流量感測</text>
