<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="ind-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/><stop offset="1" stop-color="#F5F6F8"/>
    </linearGradient>
    <linearGradient id="ind-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0111A2"/><stop offset=".45" stop-color="#3FA7F5"/>
      <stop offset=".7" stop-color="#FFC531"/><stop offset="1" stop-color="#FF4F00"/>
    </linearGradient>
    <radialGradient id="ind-hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4F00"/><stop offset=".45" stop-color="#FFB12B"/>
      <stop offset=".8" stop-color="#3FA7F5"/><stop offset="1" stop-color="#0111A2"/>
    </radialGradient>
    <filter id="ind-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="ind-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#ind-bg)"/>

  <!-- 熱氣 -->
  <g fill="none" stroke="#FF4F00" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M360 200 C345 180 375 165 360 140 C345 118 372 105 362 86"/>
    <path d="M410 196 C395 176 425 160 410 134 C395 110 422 96 412 74"/>
    <path d="M460 200 C445 180 475 165 460 140 C445 118 472 105 462 86"/>
  </g>
  <!-- 爐體 -->
  <path d="M190 262 H610 L690 340 H110 Z" fill="#1A1C22"/>
  <path d="M110 340 H690 V362 Q690 372 680 372 H120 Q110 372 110 362 Z" fill="#0B0C10"/>
  <g fill="none" stroke="#FF4F00" stroke-width="3">
    <ellipse cx="400" cy="304" rx="190" ry="28" opacity=".35"/>
    <ellipse cx="400" cy="304" rx="160" ry="23" opacity=".6" filter="url(#ind-glow)"/>
  </g>
  <!-- 控制面板 -->
  <rect x="560" y="347" width="96" height="18" rx="5" fill="#22252D"/>
  <circle cx="574" cy="356" r="4" fill="#FF4F00"/>
  <text x="588" y="361" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">AI 控溫</text>
  <!-- 鍋 -->
  <path d="M248 236 L270 300 A130 22 0 0 0 530 300 L552 236 Z" fill="#2E3139"/>
  <ellipse cx="400" cy="236" rx="152" ry="30" fill="#454A55"/>
  <ellipse cx="400" cy="238" rx="138" ry="25" fill="url(#ind-hot)"/>
  <!-- 牛排 -->
  <g>
    <ellipse cx="360" cy="238" rx="54" ry="13" fill="#9C3F27"/>
    <ellipse cx="450" cy="240" rx="44" ry="11" fill="#A8472D"/>
    <path d="M326 236 l18 -6 M342 241 l22 -8 M362 245 l22 -8 M424 239 l16 -6 M440 244 l20 -7" stroke="#5A1F10" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M552 236 L700 214 Q716 212 716 226 Q716 238 700 238 L556 252 Z" fill="#1A1C22"/>
  <!-- 溫度感測波 -->
  <circle cx="262" cy="314" r="7" fill="#0111A2"/>
  <circle cx="262" cy="314" r="14" fill="none" stroke="#0111A2" stroke-width="2" opacity=".5"/>
  <path d="M254 306 L170 246" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="84" y="240" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#0111A2">溫度感測</text>
  <!-- AI 控溫曲線卡 -->
  <rect x="560.5" y="40.5" width="209" height="139" rx="8" fill="#FFFFFF" stroke="#E2E3E6"/>
  
  <text x="578" y="70" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#000000">AI 控溫曲線</text>
  <path d="M578 158 H752" stroke="#D5D8DE" stroke-width="2"/>
  <path d="M578 96 H752" stroke="#FF4F00" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M580 156 C610 150 625 100 650 98 S700 96 750 97" fill="none" stroke="#0111A2" stroke-width="4" stroke-linecap="round"/>
  <text x="752" y="90" text-anchor="end" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="11" font-weight="500" fill="#FF4F00">目標溫度</text>
  <path d="M600 186 C600 230 640 300 610 340" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>
  <!-- 物理模型卡 -->
  <rect x="30.5" y="40.5" width="199" height="139" rx="8" fill="#FFFFFF" stroke="#E2E3E6"/>
  
  <text x="48" y="70" text-anchor="start" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="15" font-weight="700" fill="#000000">熱傳物理模型</text>
  <ellipse cx="130" cy="128" rx="78" ry="30" fill="url(#ind-hot)"/>
  <ellipse cx="130" cy="128" rx="78" ry="30" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="48" y="164" width="164" height="6" rx="3" fill="url(#ind-heat)" transform="rotate(0)"/>
  <path d="M190 186 C220 210 250 214 270 226" fill="none" stroke="#0111A2" stroke-width="2" stroke-dasharray="4 5"/>

  <rect x="24.5" y="420.5" width="751" height="159" rx="8" fill="#FFFFFF" stroke="#E2E3E6"/>
  <circle cx="118" cy="470" r="21" fill="#000000"/>
  <text x="118" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">1</text>
  <text x="118" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">溫度感測</text>
  <text x="118" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="1" fill="#58595B">SENSING</text>
  <path d="M158 470 H266" stroke="#B9BBC0" stroke-width="2" fill="none"/>
  <circle cx="306" cy="470" r="21" fill="#000000"/>
  <text x="306" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
  <text x="306" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">熱傳物理模型</text>
  <text x="306" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="1" fill="#58595B">PHYSICS MODEL</text>
  <path d="M346 470 H454" stroke="#B9BBC0" stroke-width="2" fill="none"/>
  <circle cx="494" cy="470" r="21" fill="#000000"/>
  <text x="494" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">3</text>
  <text x="494" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">AI 功率控制</text>
  <text x="494" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="1" fill="#58595B">AI CONTROL</text>
  <path d="M534 470 H642" stroke="#B9BBC0" stroke-width="2" fill="none"/>
  <circle cx="682" cy="470" r="21" fill="#FF4F00"/>
  <text x="682" y="478" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#fff">4</text>
  <text x="682" y="525" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#000000">自動烹調</text>
  <text x="682" y="556" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="16" letter-spacing="1" fill="#58595B">AUTO COOKING</text>
</svg>
