<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="path-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/><stop offset="1" stop-color="#F5F6F8"/>
    </linearGradient>
    <linearGradient id="path-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0111A2"/><stop offset=".45" stop-color="#3FA7F5"/>
      <stop offset=".7" stop-color="#FFC531"/><stop offset="1" stop-color="#FF4F00"/>
    </linearGradient>
    <radialGradient id="path-hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4F00"/><stop offset=".45" stop-color="#FFB12B"/>
      <stop offset=".8" stop-color="#3FA7F5"/><stop offset="1" stop-color="#0111A2"/>
    </radialGradient>
    <filter id="path-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <filter id="path-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#path-bg)"/>

